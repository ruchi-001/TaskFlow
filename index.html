<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <h1>TaskFlows</h1>
        <p>Organize your day beautifully</p>
    </header>


    
    <section class="progress-container">
        <div class="progress-top">
            <div>
               <p class="section-label">YOUR PRODUCTIVITY</p>
               <h2>Your Progress</h2>
               <p id="progressText">0 of 0 tasks completed</p>
            </div>
            <div class="progress-percent" id="progressPercent">0%</div>
        </div>

        <div class="progress-track">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="progress-footer">
            
            <span>Keep moving forward</span>
            <span id="remainingText">No tasks remaining</span>

        </div>
        
    </section>




    <input type="search" id="SearchTask" placeholder="Search tasks...">
    <select id="categoryFilter">
        <option value="all">All Categories</option>
        <option value="work">Work</option>
        <option value="personal">Personal</option>
        <option value="shopping">Shopping</option>
    </select>



    <div class="task-filter">
        <button id="filterAll">All</button>
        <button id="filterActive">Active</button>
        <button id="filterCompleted">Completed</button>
    </div>



    <div id="taskList"></div>



    <div class="add-task">
       <input
          type="text"
          id="taskInput"
          placeholder="What do you need to do?"
        >



        <select id="taskCategory">
           <option value="work">Work</option>
           <option value="personal" selected>Personal</option>
           <option value="shopping">Shopping</option>
       </select>


       <button id="addTaskBtn">Add Task</button>

    </div>




    <script src="script.js"></script>
</body>
</html>
